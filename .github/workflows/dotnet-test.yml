name: .NET Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore PaymentService.Tests/PaymentService.Tests.csproj
      
    - name: Build
      run: dotnet build PaymentService.Tests/PaymentService.Tests.csproj --no-restore
      
    - name: Test
      run: dotnet test PaymentService.Tests/PaymentService.Tests.csproj --no-build --verbosity normal --collect:"XPlat Code Coverage"
