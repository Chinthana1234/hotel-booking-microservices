version: '3.8'

services:
  user-service:
    build: ./user-service
    ports:
      - "5001:5001"
    env_file:
      - ./user-service/.env

  room-service:
    build: ./room-service
    ports:
      - "5002:5002"
    env_file:
      - ./room-service/.env

  booking-service:
    build: ./booking-service
    ports:
      - "5003:5003"
    env_file:
      - ./booking-service/.env
    environment:
      - ROOM_SERVICE_URL=http://room-service:5002
      - RABBITMQ_URL=amqp://rabbitmq:5672

  # ──────────────────────────────────────────────────────────────────────────
  # SQL Server 2022 (Developer Edition — free for dev/test)
  # The payment-service connects to this instead of MongoDB when
  # StorageSettings__Provider=SqlServer is set.
  # ──────────────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      # Password must meet SQL Server complexity rules (uppercase, digit, symbol)
      # Change this before pushing to any shared environment.
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd123!
    ports:
      - "1433:1433"   # expose for local tools (e.g. SSMS, DataGrip)
    volumes:
      - sqlserver_data:/var/opt/mssql  # persist data across docker-compose restarts
    healthcheck:
      # Wait until SQL Server is actually accepting TCP connections before
      # the payment-service starts (avoids migration race-condition on cold boot).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────────────────────────────────
  # Payment Service — ASP.NET Core 8 (C#)
  # Storage: SQL Server via EF Core (Step 1)
  # Existing endpoints unchanged: POST /api/payments, GET /api/payments/booking/:id
  # ──────────────────────────────────────────────────────────────────────────
  payment-service:
    build: ./payment-service-dotnet
    ports:
      - "5004:5004"
    environment:
      # ── Storage: use SQL Server (EF Core) ────────────────────────────────
      - StorageSettings__Provider=SqlServer
      # Connection string injected via env — never hardcoded in source files.
      # Format: Server=<host>;Database=<db>;User=<user>;Password=<pwd>;TrustServerCertificate=True
      - ConnectionStrings__SqlServer=Server=sqlserver;Database=HotelPayments;User Id=sa;Password=YourStrong@Passw0rd123!;TrustServerCertificate=True
      # ── PayPal (unchanged) ───────────────────────────────────────────────
      - PayPalSettings__ClientId=BAAnnvVaDaF0TyQ4vWjVT8TsnZLwUtv8eUrsYjiSxU6ppN-_rJEwgW2NLPRoctmKm8JCMnC6WkDhtI9ZYI
      - PayPalSettings__ClientSecret=ENwjbXhdwMHZGeHUX5hjzX-5wWT-IYwr49mC1njtzUYaCyphE-nNv36i4grpBS5IPl_Zr228QJL4MhBE
      - PayPalSettings__Mode=sandbox
      # Development → Swagger UI enabled, auto-migrate runs on startup
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5004
      - RabbitMQ__Host=rabbitmq
    depends_on:
      sqlserver:
        condition: service_healthy  # wait for SQL Server healthcheck to pass
      rabbitmq:
        condition: service_started

  review-service:
    build: ./review-service
    ports:
      - "5005:5005"
    env_file:
      - ./review-service/.env

  # ──────────────────────────────────────────
  # Admin Service — Python + FastAPI
  # ──────────────────────────────────────────
  admin-service:
    build: ./admin-service
    ports:
      - "5006:5006"
    env_file:
      - ./admin-service/.env
    environment:
      - USER_SERVICE_URL=http://user-service:5001
      - ROOM_SERVICE_URL=http://room-service:5002
      - BOOKING_SERVICE_URL=http://booking-service:5003
      - PAYMENT_SERVICE_URL=http://payment-service:5004
    depends_on:
      - user-service
      - room-service
      - booking-service
      - payment-service

  # ──────────────────────────────────────────
  # API Gateway — Node.js + Express
  # Routes all frontend traffic to backend services
  # ──────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    ports:
      - "5000:5000"
    env_file:
      - ./api-gateway/.env
    environment:
      - USER_SERVICE_URL=http://user-service:5001
      - ROOM_SERVICE_URL=http://room-service:5002
      - BOOKING_SERVICE_URL=http://booking-service:5003
      - PAYMENT_SERVICE_URL=http://payment-service:5004
      - REVIEW_SERVICE_URL=http://review-service:5005
      - ADMIN_SERVICE_URL=http://admin-service:5006
    depends_on:
      - user-service
      - room-service
      - booking-service
      - payment-service
      - review-service
      - admin-service

  # ──────────────────────────────────────────
  # Frontend — Next.js + Redux Toolkit (RTK Query) + Tailwind CSS
  # Replaces the old Vite + React frontend
  # ──────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api-gateway:5000
    depends_on:
      - api-gateway

  # ──────────────────────────────────────────
  # RabbitMQ Message Broker
  # ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

# ── Named volumes ───────────────────────────────────────────────────────────────
volumes:
  sqlserver_data:   # persists SQL Server data files across container restarts
